# The Site Configuration
# Documentation: https://chirpy.cotes.page/posts/getting-started/

# The language of the webpage › default to 'en'
lang: zh-CN

# Change to your timezone › https://kevinnovak.github.io/Time-Zone-Picker
timezone: Asia/Shanghai

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
title: 八宝粥的博客
tagline: 点球罚丢之后，比赛并未结束。 
description: >-
  八宝粥的技术博客，记录 Java、后端架构、分布式系统、Linux 及个人成长思考。

# Fill in the protocol & hostname for your site. e.g. 'https://username.github.io'
url: 'https://www.wangzzleo.top'

author: wangzz

github:
  username: wangzzleo

twitter:
  username: wangzzleo

social:
  name: wangzz
  email: wangzzleo@gmail.com
  links:
    - https://github.com/wangzzleo

google_analytics:
  id: 'G-K202D30ENX'

# Prefer color scheme. Values: 'light', 'dark'
# theme_mode:

# The CDN endpoint for images
# img_cdn:

# Avatar image URL or local path
# avatar: '/assets/img/avatar.png'
avatar: 'https://github.com/wangzzleo.png'

# Boolean value for TOC in post.
toc: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true

# Jekyll settings
theme: jekyll-theme-chirpy

paginate: 10

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-archives

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

collections:
  tabs:
    output: true
    sort_by: order

# Markdown parser
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

exclude:
  - vendor
  - .bundle
  - _old_backup
  - Gemfile.lock
  - node_modules
  - README.md
  - LICENSE
  - docker-compose.yml
